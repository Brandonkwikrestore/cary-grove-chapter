<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a2f5e">
<title>Member Directory — AmSpirit Cary-Grove</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a2f5e;--navy-d:#0f1d3c;--navy-l:#2a4580;
  --red:#c8102e;--gold:#d4a017;
  --white:#fff;--off:#f5f7fa;--gray:#6b7280;--gray-l:#e8ecf0;
  --text:#1f2937;--text-l:#4b5563;
  --sh:0 4px 24px rgba(26,47,94,.12);
  --fh:'Montserrat',sans-serif;--fb:'Source Sans 3',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--off);color:var(--text);min-height:100vh;padding-bottom:60px}

/* HEADER */
.hdr{background:linear-gradient(135deg,var(--navy-d) 0%,var(--navy) 60%,var(--navy-l) 100%);
  padding:14px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 16px rgba(0,0,0,.25);position:sticky;top:0;z-index:100}
.logo{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lam{font-family:var(--fh);font-weight:800;color:var(--navy);font-size:10px;line-height:1}
.lsp{font-family:var(--fh);font-weight:800;color:var(--red);font-size:10px;line-height:1}
.hdr-t h1{font-family:var(--fh);font-size:13px;font-weight:700;color:#fff;line-height:1.2}
.hdr-t p{font-size:11px;color:rgba(255,255,255,.7);margin-top:1px}
.back-link{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
  color:rgba(255,255,255,.9);font-family:var(--fh);font-size:10px;font-weight:700;
  padding:5px 10px;border-radius:14px;text-decoration:none;white-space:nowrap}

/* WRAP */
.wrap{max-width:680px;margin:0 auto;padding:18px 13px 40px}
.page-title{font-family:var(--fh);font-size:20px;font-weight:800;color:var(--navy);margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text-l);margin-bottom:18px;line-height:1.5}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:18px}
.search-wrap input{width:100%;border:1.5px solid var(--gray-l);border-radius:10px;
  padding:11px 14px 11px 40px;font-size:14px;font-family:var(--fb);
  background:var(--white);color:var(--text)}
.search-wrap input:focus{outline:none;border-color:var(--navy)}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  font-size:16px;color:var(--gray)}

/* DIRECTORY GRID */
.dir-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.dir-grid{grid-template-columns:1fr}}

/* MEMBER TILE */
.member-tile{background:var(--white);border-radius:14px;padding:14px;
  box-shadow:var(--sh);cursor:pointer;border:2px solid transparent;
  transition:all .2s;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.member-tile:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(26,47,94,.18);border-color:var(--navy-l)}
.member-tile.active{border-color:var(--navy)}
.tile-avatar{width:60px;height:60px;border-radius:50%;background:var(--navy);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fh);font-size:18px;font-weight:800;color:#fff;flex-shrink:0;
  border:3px solid var(--gray-l);overflow:hidden}
.tile-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.tile-name{font-family:var(--fh);font-size:12px;font-weight:700;color:var(--navy);line-height:1.3}
.tile-biz{font-size:11px;color:var(--gray);margin-top:1px}
.tile-badge{background:var(--off);border-radius:20px;padding:3px 9px;
  font-size:10px;font-weight:700;font-family:var(--fh);color:var(--navy-l);
  border:1px solid var(--gray-l)}

/* DETAIL CARD */
.detail-card{display:none;background:var(--white);border-radius:16px;
  padding:0;box-shadow:var(--sh);margin-bottom:18px;overflow:hidden;
  border:2px solid var(--navy)}
.detail-card.show{display:block}
.dc-top{background:linear-gradient(135deg,var(--navy-d),var(--navy));padding:24px;
  display:flex;gap:16px;align-items:center}
.dc-avatar{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fh);font-size:24px;font-weight:800;color:#fff;
  border:3px solid rgba(255,255,255,.3);flex-shrink:0;overflow:hidden}
.dc-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.dc-name{font-family:var(--fh);font-size:17px;font-weight:800;color:#fff;line-height:1.2}
.dc-company{font-size:13px;color:rgba(255,255,255,.75);margin-top:3px}
.dc-specialty{display:inline-block;background:var(--red);color:#fff;
  font-family:var(--fh);font-size:10px;font-weight:700;padding:3px 10px;
  border-radius:20px;margin-top:6px;letter-spacing:.3px}
.dc-body{padding:18px}
.dc-row{display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--gray-l);font-size:13px}
.dc-row:last-child{border-bottom:none}
.dc-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:15px;flex-shrink:0}
.dc-label{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:1px;font-family:var(--fh)}
.dc-value{font-size:13px;color:var(--text);font-weight:600}
.dc-value a{color:var(--navy);text-decoration:none;font-weight:700}
.dc-value a:hover{text-decoration:underline}
.trigger-section{background:var(--off);border-radius:10px;padding:12px 14px;margin-top:4px}
.trigger-label{font-family:var(--fh);font-size:10px;font-weight:700;color:var(--navy);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.trigger-text{font-size:12px;color:var(--text-l);line-height:1.6;font-style:italic;
  border-left:2px solid var(--red);padding-left:8px}
.close-btn{width:100%;padding:11px;background:var(--off);border:none;
  font-family:var(--fh);font-size:12px;font-weight:700;color:var(--gray);
  cursor:pointer;border-top:1px solid var(--gray-l)}
.close-btn:hover{background:var(--gray-l)}

/* LOADING */
.loading{text-align:center;padding:40px;color:var(--gray);font-size:14px}
.spin{display:inline-block;width:28px;height:28px;border:3px solid var(--gray-l);
  border-top-color:var(--navy);border-radius:50%;animation:sp .7s linear infinite;margin-bottom:10px}
@keyframes sp{to{transform:rotate(360deg)}}

.foot{text-align:center;padding:12px;font-size:11px;color:var(--gray);
  border-top:1px solid var(--gray-l);background:var(--white);
  position:fixed;bottom:0;left:0;right:0}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo"><div><div class="lam">Am</div><div class="lsp">Spirit</div></div></div>
  <div class="hdr-t"><h1>Member Directory</h1><p>AmSpirit Cary-Grove</p></div>
  <a href="javascript:history.back()" class="back-link">← Back</a>
</header>

<div class="wrap">
  <div class="page-title">👥 Member Directory</div>
  <div class="page-sub">Tap any member to see their full contact info and what they specialize in.</div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search by name, company, or specialty…" oninput="filterMembers()">
  </div>

  <!-- Expanded detail card -->
  <div class="detail-card" id="detailCard"></div>

  <!-- Directory grid -->
  <div class="dir-grid" id="dirGrid">
    <div class="loading"><div class="spin"></div><br>Loading members…</div>
  </div>
</div>

<footer class="foot">AmSpirit Business Connections · Cary-Grove Chapter</footer>

<script>
var _supa = supabase.createClient(
  'https://tlcaeddeytsjgojyogjc.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsY2FlZGRleXRzamdvanlvZ2pjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwMDQ2OTQsImV4cCI6MjA5MTU4MDY5NH0.yxrxU4dflAGa9Qngxz6UXH6emFe7mxO-v5BsFDRzzQE'
);
var CHAPTER_ID = 'a137cf6c-ac7d-4b9e-bbf3-8f6f2e1e2c92';

var TRIGGERS = {
  'Traci Emond':          '"We\'re thinking about buying" · "I want to refinance" · "Our rent just went up" · "First-time buyer"',
  'Jakob Kolodziej':      '"My rates went up" · "New car or new business" · "Not sure what coverage I have" · "Policy renewal"',
  'Vicki Genz':           '"Thinking about selling" · "Looking for a home" · "What\'s the market like?" · "Investment property"',
  'Ryan Johnson':         '"My roof is getting old" · "Hail damage" · "Insurance claim on roof" · "Leak after the storm"',
  'Sean Fergus':          '"I need a lawyer" · "Contract review" · "Starting a business" · "Estate planning"',
  'Jeremy Juhl':          '"Renovating the office" · "New office space" · "Office refresh" · "Moving to a new location"',
  'Tim Matta':            '"Planning for retirement" · "What to do with an inheritance" · "My 401k" · "College savings"',
  'Dr. Brett Rappenecker':'"My back has been killing me" · "Neck pain" · "Headaches won\'t go away" · "Car accident"',
  'Dan Kern':             '"Honey-do list" · "Can\'t find a reliable handyman" · "Small repairs piling up" · "Pre-sale prep"',
  'Brandon Bynum':        '"Water damage" · "Basement flooded" · "Mold issue" · "Fire or storm damage"',
  'Scot Bemus':           '"We need signage" · "Grand opening" · "Trade show booth" · "Vehicle wrap" · "Rebrand"',
  'Jim Heim':             '"My car\'s been making a noise" · "Check engine light came on" · "Due for an oil change" · "Need new tires"'
};

var allMembers = [];
var activeId = null;

var FALLBACK = [
  {name:'Traci Emond',specialty:'Mortgage',company:'Guild Mortgage',email:'temond@guildmortgage.net',phone:'',website:'https://cherrycreek.guildmortgage.com/'},
  {name:'Jakob Kolodziej',specialty:'Insurance',company:'Comparion Insurance',email:'jakob.kolodziej@comparioninsurance.com',phone:'',website:'https://www.comparioninsurance.com/'},
  {name:'Vicki Genz',specialty:'Real Estate',company:'New View Group – Realty One',email:'Vicki@newviewgr.com',phone:'',website:'https://www.realtyonegroup.com/'},
  {name:'Ryan Johnson',specialty:'Roofing',company:'Pink Roofing',email:'ryan@pinkroofing.com',phone:'',website:'https://pinkroofing.com/'},
  {name:'Sean Fergus',specialty:'Legal',company:'Law Offices of Sean P Fergus',email:'Sean@Ferguslawllc.com',phone:'',website:'https://ferguslawllc.com/'},
  {name:'Jeremy Juhl',specialty:'Commercial Interiors',company:'Rieke Office Interiors',email:'Jjuhl@rieke.com',phone:'',website:'https://www.rieke.com/'},
  {name:'Tim Matta',specialty:'Financial Planning',company:'Edward Jones',email:'Timothy.matta@edwardjones.com',phone:'',website:'https://www.edwardjones.com/us-en/financial-advisor/timothy-matta'},
  {name:'Dr. Brett Rappenecker',specialty:'Chiropractic',company:'Horizon Chiropractic',email:'brettrappenecker@yahoo.com',phone:'',website:'https://www.horizonchiropractic.biz/dr-brett-rappenecker/'},
  {name:'Dan Kern',specialty:'Home Maintenance',company:'Ace Handyman Services',email:'dkern@acehandymanservices.com',phone:'',website:'https://www.acehandymanservices.com/offices/fox-valley/our-team'},
  {name:'Brandon Bynum',specialty:'Restoration',company:'ServiceMaster KWIK Restore',email:'brandon@smkwik.com',phone:'',website:'https://www.linkedin.com/in/brandon-ellis-bynum-962064308/'},
  {name:'Scot Bemus',specialty:'Signs & Marketing',company:'FastSigns',email:'scot.bemus@fastsigns.com',phone:'',website:''},
  {name:'Jim Heim',specialty:'Auto Repair',company:'Tuffy Auto Repair',email:'jim@tuffyrockford.com',phone:'847-639-7428',website:''}
];

function initials(name){
  return name.split(' ').filter(function(w){return w.length>0;}).map(function(w){return w[0];}).join('').substring(0,2).toUpperCase();
}

function safeName(n){ return n.replace(/\W+/g,'_'); }

window.onload = function(){
  _supa.from('members').select('*').eq('chapter_id',CHAPTER_ID).eq('active',true).order('name')
    .then(function(r){
      allMembers = (r.data && r.data.length) ? r.data : FALLBACK;
      renderGrid(allMembers);
    })
    .catch(function(){ allMembers = FALLBACK; renderGrid(allMembers); });
};

function renderGrid(members){
  var grid = document.getElementById('dirGrid');
  if(!members.length){ grid.innerHTML='<div class="loading">No members found.</div>'; return; }
  grid.innerHTML = members.map(function(m){
    var id = safeName(m.name);
    return '<div class="member-tile" id="tile_'+id+'" onclick="showDetail(\''+id+'\')">'
      +'<div class="tile-avatar">'+initials(m.name)+'</div>'
      +'<div class="tile-name">'+m.name+'</div>'
      +'<div class="tile-biz">'+m.company+'</div>'
      +'<div class="tile-badge">'+m.specialty+'</div>'
      +'</div>';
  }).join('');
}

function showDetail(id){
  // Close if same tile tapped
  if(activeId === id){
    closeDetail(); return;
  }
  // Remove active from all tiles
  document.querySelectorAll('.member-tile').forEach(function(t){ t.classList.remove('active'); });
  var tile = document.getElementById('tile_'+id);
  if(tile) tile.classList.add('active');

  // Find member
  var m = null;
  for(var i=0;i<allMembers.length;i++){
    if(safeName(allMembers[i].name)===id){ m=allMembers[i]; break; }
  }
  if(!m) return;
  activeId = id;

  var trigger = TRIGGERS[m.name] || '';
  var phone = m.phone || '';
  var email = m.email || '';
  var addr = m.address || '';

  var html = '<div class="dc-top">'
    +'<div class="dc-avatar">'+initials(m.name)+'</div>'
    +'<div>'
      +'<div class="dc-name">'+m.name+'</div>'
      +'<div class="dc-company">'+m.company+'</div>'
      +'<div class="dc-specialty">'+m.specialty+'</div>'
    +'</div>'
    +'</div>'
    +'<div class="dc-body">';

  if(phone){
    html+='<div class="dc-row">'
      +'<div class="dc-icon" style="background:#eff4ff">📞</div>'
      +'<div><div class="dc-label">Phone</div>'
      +'<div class="dc-value"><a href="tel:'+phone+'">'+phone+'</a></div></div>'
      +'</div>';
  }
  if(email){
    html+='<div class="dc-row">'
      +'<div class="dc-icon" style="background:#e8f5e9">✉️</div>'
      +'<div><div class="dc-label">Email</div>'
      +'<div class="dc-value"><a href="mailto:'+email+'">'+email+'</a></div></div>'
      +'</div>';
  }
  if(addr){
    html+='<div class="dc-row">'
      +'<div class="dc-icon" style="background:#fff8e1">📍</div>'
      +'<div><div class="dc-label">Address</div>'
      +'<div class="dc-value">'+addr+'</div></div>'
      +'</div>';
  }
  var website = m.website || '';
  if(website){
    html+='<div class="dc-row">'
      +'<div class="dc-icon" style="background:#f0fdf4">🌐</div>'
      +'<div><div class="dc-label">Website</div>'
      +'<div class="dc-value"><a href="'+website+'" target="_blank">'+website.replace('https://','').replace('http://','').split('/')[0]+'</a></div></div>'
      +'</div>';
  }
  if(!phone && !email && !addr && !website){
    html+='<div class="dc-row"><div class="dc-icon" style="background:#f5f7fa">ℹ️</div>'
      +'<div><div class="dc-label">Contact</div><div class="dc-value" style="color:var(--gray)">Contact info not on file</div></div></div>';
  }

  if(trigger){
    html+='<div class="trigger-section">'
      +'<div class="trigger-label">🎯 Refer '+m.name.split(' ')[0]+' when you hear</div>'
      +'<div class="trigger-text">'+trigger+'</div>'
      +'</div>';
  }

  html+='</div>'
    +'<button class="close-btn" onclick="closeDetail()">✕ Close</button>';

  var card = document.getElementById('detailCard');
  card.innerHTML = html;
  card.classList.add('show');

  // Scroll to detail card smoothly
  setTimeout(function(){ card.scrollIntoView({behavior:'smooth',block:'start'}); }, 50);
}

function closeDetail(){
  document.getElementById('detailCard').classList.remove('show');
  document.querySelectorAll('.member-tile').forEach(function(t){ t.classList.remove('active'); });
  activeId = null;
}

function filterMembers(){
  var q = document.getElementById('searchInput').value.toLowerCase().trim();
  if(!q){ renderGrid(allMembers); return; }
  var filtered = allMembers.filter(function(m){
    return m.name.toLowerCase().indexOf(q)>=0
      || (m.company||'').toLowerCase().indexOf(q)>=0
      || (m.specialty||'').toLowerCase().indexOf(q)>=0;
  });
  renderGrid(filtered);
  closeDetail();
}
</script>
</body>
</html>
